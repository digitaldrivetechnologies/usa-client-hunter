name: USA Client Hunter Daily
on:
  schedule:
        - cron: '0 14 * * *'  # Runs 9 AM EST (2 PM UTC) daily
  workflow_dispatch:  # Allows manual run

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v3
            - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
            - name: Install
        run: pip install requests
            - name: Run Hunter
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python USA_ENGLISH_ONLY_BOT.py
            - name: Upload Leads
        uses: actions/upload-artifact@v4
        with:
          name: usa-leads
          path: "*.csv"
