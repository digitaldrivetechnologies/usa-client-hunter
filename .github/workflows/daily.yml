name: USA Client Hunter Daily

on:
  schedule:
    - cron: '0 14 * * *'  # 9 AM EST daily
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run Hunter Bot
        run: python USA_ENGLISH_ONLY_BOT.py

      - name: Upload USA Leads
        uses: actions/upload-artifact@v4
        with:
          name: usa-leads
          path: "*.csv"
          retention-days: 30
